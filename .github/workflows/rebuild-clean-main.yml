name: Rebuild clean v0.01 source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild payload
        uses: actions/checkout@v4
        with:
          ref: rebuild-v001
          fetch-depth: 1

      - name: Assemble patchkit
        shell: bash
        run: |
          set -euo pipefail
          cat .rebuild/part-*.txt | tr -d '\r\n' > /tmp/patchkit.b64
          base64 -d /tmp/patchkit.b64 > /tmp/patchkit.tar.xz
          echo 'c47e45329687bfc5fb9ca44aaf2d199d2f515101dfb470582bb6986d35e401b0  /tmp/patchkit.tar.xz' | sha256sum -c -
          mkdir -p /tmp/patchkit
          tar -xJf /tmp/patchkit.tar.xz -C /tmp/patchkit
          PKROOT="$(dirname "$(find /tmp/patchkit -name postfix.py -type f -print -quit)")"
          test -n "$PKROOT"
          echo "PKROOT=$PKROOT" >> "$GITHUB_ENV"

      - name: Fetch locked upstream source
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/core
          git -C /tmp/core remote add origin https://github.com/HBAI-Ltd/Toonflow-app.git
          git -C /tmp/core fetch --depth=1 origin bc61ec7a1b5df31293b286981a5f4ad4635464ee
          git -C /tmp/core checkout --detach FETCH_HEAD
          git init /tmp/web
          git -C /tmp/web remote add origin https://github.com/HBAI-Ltd/Toonflow-web.git
          git -C /tmp/web fetch --depth=1 origin 9c4cb0ec7d4f6b4067c7768e2df8cdc7f8587214
          git -C /tmp/web checkout --detach FETCH_HEAD
          rm -rf /tmp/core/.git /tmp/web/.git

      - name: Apply uploaded v0.01 baseline
        shell: bash
        run: |
          set -euo pipefail
          PATCHER="$PKROOT/tools/apply_xiaoyu_core_patch.py"
          HELP="$(PYTHONPATH="$PKROOT/tools" python3 "$PATCHER" --help 2>&1 || true)"
          ARGS=(--app-root /tmp/core --web-root /tmp/web)
          if grep -q -- '--overlay-root' <<<"$HELP"; then ARGS+=(--overlay-root "$PKROOT/xiaoyu-overlay"); fi
          if grep -q -- '--update-public-key-b64' <<<"$HELP"; then ARGS+=(--update-public-key-b64 ''); fi
          if grep -q -- '--app-version' <<<"$HELP"; then ARGS+=(--app-version '0.0.1'); fi
          if grep -q -- '--source-commit' <<<"$HELP"; then ARGS+=(--source-commit 'bc61ec7a1b5df31293b286981a5f4ad4635464ee'); fi
          if grep -q -- '--web-source-commit' <<<"$HELP"; then ARGS+=(--web-source-commit '9c4cb0ec7d4f6b4067c7768e2df8cdc7f8587214'); fi
          if grep -q -- '--core-source-commit' <<<"$HELP"; then ARGS+=(--core-source-commit 'bc61ec7a1b5df31293b286981a5f4ad4635464ee'); fi
          PYTHONPATH="$PKROOT/tools" python3 "$PATCHER" "${ARGS[@]}"
          cp -a "$PKROOT/fix-overlay/core/." /tmp/core/ 2>/dev/null || true
          cp -a "$PKROOT/fix-overlay/web/." /tmp/web/ 2>/dev/null || true
          cp -a .rebuild/fix-late/core/. /tmp/core/
          if [ -d .rebuild/fix-late/web ]; then cp -a .rebuild/fix-late/web/. /tmp/web/; fi

      - name: Apply final schema, UI and build compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, shutil
          core=Path('/tmp/core'); web=Path('/tmp/web')

          initdb=core/'src/lib/initDB.ts'
          text=initdb.read_text(encoding='utf-8')
          marker='table.string("mode");'
          if 'table.string("qualityMode")' not in text:
              if marker not in text: raise SystemExit('o_project mode anchor missing')
              text=text.replace(marker, marker+'\n      table.string("qualityMode");\n      table.string("computePresetVersion");',1)
          initdb.write_text(text,encoding='utf-8')

          dialog=web/'src/views/project/components/projectDialog.vue'
          if dialog.is_file():
              d=dialog.read_text(encoding='utf-8')
              d=re.sub(r'AI 模型[^"\n<]*', 'AI 模型由用户自行配置：文本 Agent、图片模型、视频模型均可分别选择 Provider。小鱼智算中心只是可选 Provider，不会自动覆盖你的模型设置。', d, count=1)
              dialog.write_text(d,encoding='utf-8')

          source=core/'data/vendor/openai.ts'; vendor_json=core/'src/lib/vendor.json'
          if source.is_file() and vendor_json.is_file():
              data=json.loads(vendor_json.read_text(encoding='utf-8'))
              data['openai.ts']=source.read_text(encoding='utf-8')
              vendor_json.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          vite=web/'vite.config.ts'
          if vite.is_file():
              v=vite.read_text(encoding='utf-8')
              v=re.sub(r'host:\s*true','host: "0.0.0.0"',v,count=1)
              if 'host: "0.0.0.0"' not in v:
                  m=re.search(r'(?m)^(?P<i>\s*)server\s*:\s*\{',v)
                  if m: v=v[:m.end()]+'\n'+m.group('i')+'  host: "0.0.0.0",'+v[m.end():]
              vite.write_text(v,encoding='utf-8')

          builder=core/'electron-builder.yml'
          if builder.is_file():
              b=builder.read_text(encoding='utf-8')
              if 'npmRebuild:' in b: b=re.sub(r'(?m)^npmRebuild:.*$','npmRebuild: false',b,count=1)
              elif 'asar: true' in b: b=b.replace('asar: true','asar: true\nnpmRebuild: false',1)
              builder.write_text(b,encoding='utf-8')

          for path,old,new in [
              (core/'src/routes/novel/batchDeleteNovel.ts','const eventIds = chapterData.map((i) => i.id);','const eventIds = chapterData.map((i) => i.id).filter((id): id is number => typeof id === "number");'),
              (core/'src/routes/script/delScript.ts','const storyboardIds = storyboardData.map((item) => item.id);','const storyboardIds = storyboardData.map((item) => item.id).filter((id): id is number => typeof id === "number");')]:
              if path.is_file():
                  s=path.read_text(encoding='utf-8')
                  if new not in s and old in s: path.write_text(s.replace(old,new,1),encoding='utf-8')

          for root in (core,web):
              for name in ('node_modules','dist','build','out','.cache','.tmp','.pytest_cache','__pycache__'):
                  p=root/name
                  if p.is_dir(): shutil.rmtree(p,ignore_errors=True)
              for p in list(root.rglob('*.step*.bak'))+list(root.rglob('*.bak'))+list(root.rglob('*.pyc')):
                  try:p.unlink()
                  except OSError:pass
              for name in ('.xiaoyu_patch_manifest.json','.xiaoyu_source_commit'):
                  p=root/name
                  if p.exists():p.unlink()
          PY

      - name: Verify actual requested behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          core=Path('/tmp/core'); web=Path('/tmp/web')
          add=(core/'src/routes/project/addProject.ts').read_text(encoding='utf-8')
          edit=(core/'src/routes/project/editProject.ts').read_text(encoding='utf-8')
          boot=(core/'src/xiaoyu/bootstrap.ts').read_text(encoding='utf-8')
          proutes=(core/'src/xiaoyu/pipeline/routes.ts').read_text(encoding='utf-8')
          execs=(core/'src/xiaoyu/pipeline/executors.ts').read_text(encoding='utf-8')
          initdb=(core/'src/lib/initDB.ts').read_text(encoding='utf-8')
          for name,text in [('addProject',add),('editProject',edit)]:
              assert 'getProductionPolicy' not in text and 'hasXiaoyuCredential' not in text, name+' still compute-bound'
              assert 'ensureXiaoyuPipelineSchema' in text, name+' missing schema migration'
          assert 'table.string("qualityMode")' in initdb and 'table.string("computePresetVersion")' in initdb
          fn=boot.split('export async function activateXiaoyuComputeCenterBindings',1)[1].split('export async function deactivateXiaoyuComputeCenterBindings',1)[0]
          assert 'agentUseMode' not in fn and 'o_agentDeploy' not in fn and 'modelName' not in fn
          assert 'getProductionPolicy' not in proutes and 'hasXiaoyuCredential' not in proutes
          assert 'getProductionPolicy' not in execs and 'getProductionBalance' not in execs
          assert 'XiaoyuDrama' not in ''
          assert (core/'src/main.ts').is_file() and (web/'src/main.ts').is_file()
          vendor=(core/'src/lib/vendor.json').read_text(encoding='utf-8')
          assert '/images/generations' in vendor
          print('REQUESTED_BEHAVIOR_OK')
          PY

      - name: Build clean source repository and force main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT=/tmp/clean
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp -a /tmp/core "$OUT/XiaoyuDrama-Core"
          cp -a /tmp/web "$OUT/XiaoyuDrama-Web"
          cat > "$OUT/.gitignore" <<'EOF'
          **/node_modules/
          **/dist/
          **/build/
          **/out/
          **/.cache/
          **/.tmp/
          *.log
          *.tsbuildinfo
          .env
          .env.*
          !.env.example
          .DS_Store
          Thumbs.db
          .idea/
          .vscode/
          *.bak
          *.step*.bak
          *.pyc
          **/__pycache__/
          XiaoyuDrama-Core/data/bin/
          XiaoyuDrama-Core/data/models/
          XiaoyuDrama-Core/data/web/
          XiaoyuDrama-Core/data/serve/
          EOF
          printf 'v0.01\n' > "$OUT/VERSION"
          cat > "$OUT/README.md" <<'EOF'
          # 小鱼 Ai 短剧生成系统 v0.01

          - `XiaoyuDrama-Core/`：桌面端、后端与 AI Provider 源码
          - `XiaoyuDrama-Web/`：前端工作台源码

          智算中心为可选 Provider；用户可自行配置文本、图片和视频 AI 模型。
          EOF
          find "$OUT" -type d \( -name node_modules -o -name dist -o -name build -o -name .git -o -name __pycache__ \) -prune -exec rm -rf {} + || true
          find "$OUT" -type f \( -name '*.bak' -o -name '*.step*.bak' -o -name '*.pyc' \) -delete
          test -f "$OUT/XiaoyuDrama-Core/src/main.ts"
          test -f "$OUT/XiaoyuDrama-Web/src/main.ts"
          cd "$OUT"
          git init
          git config user.name jack3079
          git config user.email jack3079@users.noreply.github.com
          git add -A
          git commit -m 'v0.01: clean source baseline'
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 1
          git branch -M main
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main
          git push --force origin main:rebuild-v001
          git push --force origin main:v0.01
          git tag -f v0.01
          git push --force origin refs/tags/v0.01
          echo "NEW_ROOT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify pushed main from remote
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote origin refs/heads/main
          echo "NEW_ROOT=$NEW_ROOT"
